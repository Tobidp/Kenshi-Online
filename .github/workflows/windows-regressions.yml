name: Windows regressions

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Configure Release x64
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Unit regressions
        run: |
          & ./build/bin/Release/KenshiMP.UnitTest.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Protocol integration
        working-directory: build/bin/Release
        timeout-minutes: 8
        run: |
          cmd /d /c "KenshiMP.IntegrationTest.exe <NUL"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

